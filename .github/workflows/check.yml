name: Extension checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - name: Package unpacked alpha
        run: cd extension && zip -r ../softgloss-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: softgloss-extension-alpha
          path: softgloss-extension.zip
