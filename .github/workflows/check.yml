name: Extension checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild dictionary from the pinned offline snapshot
        run: |
          python3 scripts/import-dictionary.py data/source-snapshot.parts.json
          python3 scripts/import-morphology.py data/morphology-source.json.gz
          python3 scripts/import-curriculum.py
          git diff --exit-code -- extension/dictionary extension/morphology extension/study data/morphology-manifest.json
      - run: npm test
      - run: npm run check
      - name: Package unpacked alpha
        run: cd extension && zip -r ../softgloss-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: softgloss-extension-alpha
          path: softgloss-extension.zip
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser tools
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node browser-tests/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
